# Non-secret settings, injected into the pods as environment variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: leaderboard-config
data:
  DB_URL: jdbc:postgresql://postgres:5432/game_leaderboard
  DB_POOL_SIZE: "20"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SPRING_PROFILES_ACTIVE: json
  LEADERBOARD_SEASON: S1
  JAVA_OPTS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
